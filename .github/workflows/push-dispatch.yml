# Sends due prayer/adhkar reminders by calling the app's dispatch endpoint.
# Setup (repo → Settings → Secrets and variables → Actions):
#   APP_URL      e.g. https://istiqamah.vercel.app
#   CRON_SECRET  same value as the app's CRON_SECRET env var
# The job is a no-op until both secrets exist. GitHub may delay scheduled runs by
# a few minutes; the dispatcher tolerates up to 20 minutes and never double-sends.
# On Vercel Pro you can use Vercel Cron instead (see README) and disable this.
name: Push reminders

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions: {}

jobs:
  dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Call dispatch endpoint
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$APP_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "APP_URL / CRON_SECRET not configured; skipping."
            exit 0
          fi
          curl --fail-with-body --silent --show-error --max-time 60 \
            -H "Authorization: Bearer $CRON_SECRET" \
            "$APP_URL/api/push/dispatch"
