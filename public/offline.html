<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Offline · Istiqamah</title>
    <style>
      :root { --bg: #faf7f0; --ink: #1f2a24; --muted: #56645b; --primary: #2f6b4f; --primary-ink: #fff; }
      @media (prefers-color-scheme: dark) {
        :root { --bg: #0f1714; --ink: #e9f0eb; --muted: #a5b5ab; --primary: #86c9a5; --primary-ink: #0d1f17; }
      }
      body { margin: 0; min-height: 100dvh; display: grid; place-items: center; background: var(--bg); color: var(--ink);
             font-family: ui-sans-serif, system-ui, sans-serif; padding: 1.5rem; box-sizing: border-box; }
      main { max-width: 26rem; text-align: center; }
      h1 { font-size: 1.75rem; margin: 1rem 0 0.5rem; }
      p { color: var(--muted); line-height: 1.6; }
      button { margin-top: 1rem; min-height: 3rem; padding: 0 1.5rem; border: 0; border-radius: 1rem; font-size: 1rem;
               font-weight: 600; background: var(--primary); color: var(--primary-ink); cursor: pointer; }
    </style>
  </head>
  <body>
    <main>
      <img src="/icon.svg" width="56" height="56" alt="" />
      <h1>You're offline</h1>
      <p>No connection right now. Anything you've opened recently is still available. Begin again when you're back online.</p>
      <button type="button" onclick="location.reload()">Try again</button>
    </main>
  </body>
</html>
